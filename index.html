<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성광고 학습 플랫폼</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 + Babel Standalone (빌드 없이 JSX 실행) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(.97) } to { opacity: 1; transform: none } }
    .animate-fade { animation: fadeIn .18s ease-out }
    .animate-pop { animation: popIn .22s cubic-bezier(.16,1,.3,1) }
    .no-scrollbar::-webkit-scrollbar { display: none }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
  </style>
</head>
<body class="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useMemo, useRef, useEffect } = React;

    /* ===================== 상수 ===================== */
    // 학교 코드 3135 → 학생(student), 5131 → 관리자(admin)
    // ※ 주의: 프론트엔드에 내장된 코드는 누구나 확인 가능 — 시연용 권한 분리입니다.
    const SCHOOL_CODES = { "3135": "student", "5131": "admin" };
    const GRADES = [1, 2, 3];
    const CLASSES = Array.from({ length: 12 }, (_, i) => i + 1);
    const SUBJECTS = ["국어","수학","영어","한국사","통합사회","통합과학","물리학","화학","생명과학","지구과학","정보","음악","미술","체육","진로","기타"];
    const PRIORITIES = [
      { key: "high", label: "높음", chip: "bg-rose-100 text-rose-700 border-rose-200", rank: 0 },
      { key: "mid",  label: "보통", chip: "bg-amber-100 text-amber-700 border-amber-200", rank: 1 },
      { key: "low",  label: "낮음", chip: "bg-sky-100 text-sky-700 border-sky-200", rank: 2 },
    ];
    const BASE_TABS = [
      { key: "planner",     label: "나만의 맞춤 학습 플래너", icon: "🎯" },
      { key: "materials",   label: "수업 자료실",           icon: "📚" },
      { key: "assignments", label: "수행평가 일정",         icon: "📝" },
      { key: "examscope",   label: "시험 범위",             icon: "🗂️" },
      { key: "books",       label: "추천 교재/족보",        icon: "⭐" },
    ];
    const ADMIN_TAB = { key: "requests", label: "학생 요청사항 관리", icon: "📮" };
    const POST_TABS = ["materials", "assignments", "examscope", "books"];

    const EMPTY_AUTH = { userId: "", password: "", password2: "", name: "", grade: 1, classNum: 1, schoolCode: "" };
    const EMPTY_FORM = {
      title: "", subject: SUBJECTS[0], content: "", grade: 1, classNum: 0,
      due: "", bookType: "추천 교재", file: null, fileName: "", fileType: "", fileSizeB: 0,
    };

    /* ===================== 날짜 유틸 ===================== */
    const pad = (n) => String(n).padStart(2, "0");
    const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const TODAY = toDateStr(new Date());
    const dday = (s) => {
      if (!s) return null;
      const t = new Date(`${s.slice(0, 10)}T00:00:00`);
      const n = new Date(); n.setHours(0, 0, 0, 0);
      return Math.round((t - n) / 86400000);
    };
    const ddayLabel = (n) => (n === null ? "-" : n === 0 ? "D-DAY" : n > 0 ? `D-${n}` : `D+${Math.abs(n)}`);
    const fmtDate = (s) => (!s ? "-" : new Date(s).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "short" }));
    const fmtDateTime = (s) => (!s ? "-" : new Date(s).toLocaleString("ko-KR", { month: "long", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" }));
    const fmtSize = (b) => (!b ? "0B" : b < 1024 ? `${b}B` : b < 1048576 ? `${(b / 1024).toFixed(1)}KB` : `${(b / 1048576).toFixed(2)}MB`);

    /* ===================== 학년/반 필터링 ===================== */
    /** 학생: [내 학년 공통(classNum===0)] + [내 학년 & 내 반]만 / 관리자: 전체 열람 */
    function filterForUser(list, user) {
      if (!user || !Array.isArray(list)) return [];
      if (user.role === "admin") return [...list];
      const g = Number(user.grade), c = Number(user.classNum);
      return list.filter((p) => Number(p.grade) === g && (Number(p.classNum) === 0 || Number(p.classNum) === c));
    }
    const sortPosts = (list) => [...list].sort((a, b) => b.createdAt - a.createdAt);

    /* ===================== AI 게시물 필터링 시뮬레이션 ===================== */
    const BANNED = ["시발","씨발","ㅅㅂ","병신","ㅂㅅ","ㅄ","존나","ㅈㄴ","개새","미친놈","꺼져","ㄲㅈ","죽어라","찐따","빡대가리","멍청이","등신","니애미","야동","도박","지랄","엿먹"];
    const JOKE = ["장난","ㅋㅋ","ㅎㅎ","ㅠㅠ","ㅜㅜ","ㄱㄱ","ㄴㄴ","ㅇㅇ","asdf","ㅁㄴㅇㄹ","qwer","1234567"];

    function aiModerate({ title = "", content = "", subject = "" }) {
      const flat = `${title} ${content}`.replace(/\s+/g, "");
      if (flat.length < 4) return { ok: false, tag: "정보 부족", reason: "내용이 너무 짧아 학습 자료로서의 가치를 판단할 수 없습니다. 제목과 설명을 4자 이상 구체적으로 작성해 주세요." };
      const jamo = (flat.match(/[ㄱ-ㅎㅏ-ㅣ]/g) || []).length;
      if (jamo / flat.length > 0.25 || /[ㄱ-ㅎㅏ-ㅣ]{3,}/.test(flat))
        return { ok: false, tag: "장난성 입력", reason: "의미 없는 자음/모음(ㅋㅋㅋ, ㅎㅎㅎ, ㅁㄴㅇㄹ 등)이 과도하게 포함되어 있습니다. 학습과 무관한 게시물로 분류되었습니다." };
      if (/(.)\1{3,}/.test(flat))
        return { ok: false, tag: "도배 의심", reason: "동일한 문자가 4회 이상 반복됩니다. 도배성 게시물로 판단되어 등록이 거절되었습니다." };
      const ban = BANNED.find((w) => flat.includes(w));
      if (ban) return { ok: false, tag: "유해 표현", reason: `부적절한 표현("${ban}")이 감지되었습니다. 학교 커뮤니티 이용 수칙에 따라 등록할 수 없습니다.` };
      const joke = JOKE.find((w) => flat.includes(w));
      if (joke) return { ok: false, tag: "주제 벗어남", reason: `학습과 무관한 장난성 키워드("${joke}")가 포함되어 있습니다. 실제 수업/평가 관련 정보만 등록해 주세요.` };
      if (!/[가-힣a-zA-Z0-9]/.test(flat)) return { ok: false, tag: "형식 오류", reason: "특수문자만으로 구성된 게시물은 등록할 수 없습니다." };
      return { ok: true, tag: "검수 통과", reason: `학습 관련 자료(${subject || "일반"})로 확인되었습니다. 등록을 승인합니다.` };
    }

    /* ===================== 공용 UI ===================== */
    const inputCls =
      "w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-slate-900 placeholder-slate-400 " +
      "focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition text-sm";

    function Modal({ open, onClose, title, subtitle, children, footer, maxW = "max-w-lg" }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-[90] flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm sm:p-4 animate-fade" onClick={onClose}>
          <div className={`w-full ${maxW} bg-white rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] flex flex-col animate-pop`} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-start justify-between gap-4 px-6 pt-6 pb-4 border-b border-slate-100">
              <div>
                <h3 className="text-lg font-bold text-slate-900 leading-snug">{title}</h3>
                {subtitle && <p className="text-sm text-slate-500 mt-1">{subtitle}</p>}
              </div>
              <button type="button" onClick={onClose} className="shrink-0 w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold transition">✕</button>
            </div>
            <div className="px-6 py-5 overflow-y-auto text-slate-800">{children}</div>
            {footer && <div className="px-6 py-4 border-t border-slate-100 bg-slate-50 sm:rounded-b-3xl">{footer}</div>}
          </div>
        </div>
      );
    }

    function Field({ label, children, hint }) {
      return (
        <label className="block mb-4">
          <span className="block text-sm font-semibold text-slate-700 mb-1.5">{label}</span>
          {children}
          {hint && <span className="block text-xs text-slate-400 mt-1">{hint}</span>}
        </label>
      );
    }

    function ScopeBadge({ grade, classNum }) {
      const common = Number(classNum) === 0;
      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-bold border ${common ? "bg-indigo-50 text-indigo-700 border-indigo-200" : "bg-emerald-50 text-emerald-700 border-emerald-200"}`}>
          {common ? `${grade}학년 공통` : `${grade}학년 ${classNum}반`}
        </span>
      );
    }

    function AuthorBadge({ post }) {
      const admin = post.authorRole === "admin";
      return (
        <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold border ${admin ? "bg-violet-100 text-violet-800 border-violet-200" : "bg-slate-100 text-slate-700 border-slate-200"}`}>
          <span className={`w-4 h-4 rounded-full text-white grid place-items-center text-[9px] ${admin ? "bg-violet-700" : "bg-slate-700"}`}>{post.authorName.slice(0, 1)}</span>
          {admin ? `관리자 ${post.authorName}` : `${post.authorGrade}학년 ${post.authorClass}반 ${post.authorName}`}
        </span>
      );
    }

    function RoleBadge({ role }) {
      return role === "admin"
        ? <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-violet-600 text-white">관리자</span>
        : <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-indigo-600 text-white">학생</span>;
    }

    function TrashButton({ onClick, title = "삭제" }) {
      return (
        <button type="button" title={title}
          onClick={(e) => { e.stopPropagation(); onClick(); }}
          className="shrink-0 w-8 h-8 grid place-items-center rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6" />
          </svg>
        </button>
      );
    }

    const EmptyState = ({ icon, text }) => (
      <div className="py-16 text-center">
        <div className="text-4xl mb-3">{icon}</div>
        <p className="text-slate-500 text-sm">{text}</p>
      </div>
    );

    const ProgressBar = ({ value }) => (
      <div className="w-full h-3 rounded-full bg-slate-200 overflow-hidden">
        <div className="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 transition-all duration-700" style={{ width: `${value}%` }} />
      </div>
    );

    const Toast = ({ msg }) =>
      !msg ? null : (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[95] px-5 py-3 rounded-2xl bg-slate-900 text-white text-sm font-semibold shadow-2xl animate-pop max-w-[90vw] text-center">
          {msg}
        </div>
      );

    /* ===================== 시드 데이터 ===================== */
    const seedAuthor = (name, grade, classNum, role = "student") => ({
      authorId: "__seed__", authorName: name, authorGrade: grade, authorClass: classNum, authorRole: role,
    });

    const makeSeed = () => {
      const mk = (type, obj) => ({ id: `${type}-${Math.random().toString(36).slice(2, 9)}`, type, createdAt: Date.now() - Math.floor(Math.random() * 86400000), ...obj });
      const Y = new Date().getFullYear();
      const out = { materials: [], assignments: [], examscope: [], books: [] };
      GRADES.forEach((g) => {
        out.materials.push(
          mk("materials", { title: `${g}학년 수학 - 삼각함수 핵심 정리 프린트`, subject: "수학", content: "수업 중 배부된 핵심 정리 프린트입니다. 개념 요약 + 유형별 대표문제 12문항 포함.", grade: g, classNum: 0, file: null, fileName: "", fileType: "", fileSizeB: 0, ...seedAuthor("교무부", g, 0, "admin") }),
          mk("materials", { title: `${g}학년 영어 본문 분석 자료 (Lesson 5)`, subject: "영어", content: "Lesson 5 본문 구문 분석 및 어휘 정리본입니다. 시험 대비용으로 활용하세요.", grade: g, classNum: 8, file: null, fileName: "", fileType: "", fileSizeB: 0, ...seedAuthor("김서연", g, 8) }),
          mk("materials", { title: `${g}학년 3반 국어 필기 공유`, subject: "국어", content: "3반 수업 필기 정리본입니다. (다른 반에는 보이지 않아야 정상)", grade: g, classNum: 3, file: null, fileName: "", fileType: "", fileSizeB: 0, ...seedAuthor("박준서", g, 3) })
        );
        out.assignments.push(
          mk("assignments", { title: `${g}학년 국어 - 비평문 작성 수행평가`, subject: "국어", content: "제시된 작품 중 1편을 선택해 A4 2매 분량의 비평문을 작성하여 제출합니다. 분량 미달 시 감점.", grade: g, classNum: 0, due: `${Y}-11-07T16:00`, ...seedAuthor("교무부", g, 0, "admin") }),
          mk("assignments", { title: `${g}학년 8반 과학 탐구 보고서 제출`, subject: "통합과학", content: "모둠별 탐구 주제 선정 후 실험 설계와 결과 분석을 보고서로 작성합니다.", grade: g, classNum: 8, due: `${Y}-11-21T09:00`, ...seedAuthor("박지훈", g, 8) })
        );
        out.examscope.push(
          mk("examscope", { title: `${g}학년 2학기 기말고사 - 수학 시험범위`, subject: "수학", content: "교과서 p.112~168 / 부교재 유형서 3단원 전체 / 수업 중 배부 프린트 4~7회차\n※ 서술형 4문항 출제 예정", grade: g, classNum: 0, ...seedAuthor("교무부", g, 0, "admin") })
        );
        out.books.push(
          mk("books", { title: "쎈 수학 (고등) - 유형 반복 학습용", subject: "수학", bookType: "추천 교재", content: "기본 개념 정리 후 유형별 반복 훈련에 가장 효율적입니다. B단계까지는 필수로 풀어보는 것을 추천합니다.", grade: g, classNum: 0, ...seedAuthor("이도현", g, 3) }),
          mk("books", { title: `${g}학년 1학기 기말 기출 족보 정리본`, subject: "기타", bookType: "족보", content: "작년 선배들이 정리한 기출 문항 유형 분석본입니다. 반복 출제되는 개념 위주로 정리되어 있습니다.", grade: g, classNum: 8, ...seedAuthor("최유진", g, 8) })
        );
      });
      return out;
    };

    const defaultPlanner = () => {
      const y = new Date().getFullYear();
      return {
        todos: [
          { id: "t1", text: "수학 쎈 3단원 유형 25~40번 풀기", subject: "수학", book: "쎈 수학", unit: "3단원 삼각함수", priority: "high", done: false, date: TODAY },
          { id: "t2", text: "영어 본문 Lesson 5 어휘 60개 암기", subject: "영어", book: "교과서", unit: "Lesson 5", priority: "mid", done: true, date: TODAY },
          { id: "t3", text: "국어 비문학 지문 3개 풀고 오답 정리", subject: "국어", book: "마더텅", unit: "독서", priority: "mid", done: false, date: TODAY },
        ],
        memos: [
          { id: "m1", title: "수학 오답 - 삼각함수 그래프 주기", subject: "수학", content: "y=a·sin(bx+c)+d 에서 주기는 2π/|b|. b를 묶어내지 않고 계산해서 틀림. 반드시 b로 묶은 뒤 주기 계산할 것!", createdAt: Date.now() },
        ],
        exams: [
          { id: "e1", name: "11월 전국연합 모의고사", date: `${y}-11-12` },
          { id: "e2", name: "2학기 기말고사", date: `${y}-12-10` },
        ],
      };
    };

    const AI_PLAN_TEMPLATES = [
      { text: "{subject} 취약 단원 개념 재정리 + 예제 10문항", priority: "high" },
      { text: "{subject} 기출/족보 유형 20문항 타이머 풀이 (25분)", priority: "high" },
      { text: "어제 오답노트 전체 복기 후 유사 문항 5개 재풀이", priority: "mid" },
      { text: "영어 본문 낭독 2회 + 핵심 구문 5개 암기", priority: "mid" },
      { text: "국어 비문학 지문 2개 풀이 및 지문 구조도 그리기", priority: "mid" },
      { text: "{subject} 수업 필기 20분 요약 정리 (백지 복습)", priority: "low" },
    ];

    /* ===================== 메인 컴포넌트 ===================== */
    function SungkwangApp() {
      /* ---------- 인증 ---------- */
      const [users, setUsers] = useState([
        { userId: "hong",  password: "1234", name: "홍길동",  grade: 1, classNum: 8, role: "student" },
        { userId: "admin", password: "1234", name: "김선생", grade: 1, classNum: 1, role: "admin" },
      ]);
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState("login");
      const [authForm, setAuthForm] = useState(EMPTY_AUTH);
      const [authError, setAuthError] = useState("");

      /* ---------- 데이터 ---------- */
      const [posts, setPosts] = useState(makeSeed);
      const [requests, setRequests] = useState([]);
      const [plannerStore, setPlannerStore] = useState({});

      /* ---------- UI ---------- */
      const [activeTab, setActiveTab] = useState("planner");
      const [showWelcome, setShowWelcome] = useState(false);
      const [showWidget, setShowWidget] = useState(false);
      const [detail, setDetail] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [addOpen, setAddOpen] = useState(false);
      const [editingPost, setEditingPost] = useState(null);
      const [aiError, setAiError] = useState(null);
      const [aiPass, setAiPass] = useState("");
      const [toast, setToast] = useState("");
      const [form, setForm] = useState(EMPTY_FORM);
      const fileRef = useRef(null);

      /* ---------- 학생 요청 ---------- */
      const [requestTarget, setRequestTarget] = useState(null);
      const [requestType, setRequestType] = useState("삭제");
      const [requestReason, setRequestReason] = useState("");

      /* ---------- 플래너 ---------- */
      const [todoForm, setTodoForm] = useState({ text: "", subject: SUBJECTS[0], book: "", unit: "", priority: "mid" });
      const [memoForm, setMemoForm] = useState({ title: "", subject: SUBJECTS[0], content: "" });
      const [editingExam, setEditingExam] = useState(null);
      const [examDraft, setExamDraft] = useState({ name: "", date: "" });
      const [aiLoading, setAiLoading] = useState(false);
      const [aiPlanMsg, setAiPlanMsg] = useState("");

      /* ---------- 로그아웃: null 감지 시 세션 UI 전체 초기화 ---------- */
      const handleLogout = () => setCurrentUser(null);
      useEffect(() => {
        if (currentUser) return;
        setAuthMode("login"); setAuthError(""); setActiveTab("planner");
        setShowWelcome(false); setShowWidget(false); setDetail(null);
        setDeleteTarget(null); setAddOpen(false); setEditingPost(null);
        setAiError(null); setAiPass(""); setForm(EMPTY_FORM);
        setRequestTarget(null); setRequestReason(""); setEditingExam(null); setAiPlanMsg("");
        setTodoForm({ text: "", subject: SUBJECTS[0], book: "", unit: "", priority: "mid" });
        setMemoForm({ title: "", subject: SUBJECTS[0], content: "" });
        window.scrollTo(0, 0);
      }, [currentUser]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

      /* ---------- 파생 ---------- */
      const planner = currentUser ? (plannerStore[currentUser.userId] || defaultPlanner()) : null;
      const setPlanner = (updater) =>
        setPlannerStore((prev) => {
          const cur = prev[currentUser.userId] || defaultPlanner();
          return { ...prev, [currentUser.userId]: typeof updater === "function" ? updater(cur) : updater };
        });

      const todayTodos = useMemo(() => {
        if (!planner) return [];
        const pr = (k) => (PRIORITIES.find((p) => p.key === k) || {}).rank ?? 9;
        return [...planner.todos].filter((t) => t.date === TODAY).sort((a, b) => (a.done - b.done) || (pr(a.priority) - pr(b.priority)));
      }, [planner]);
      const doneCount = todayTodos.filter((t) => t.done).length;
      const progress = todayTodos.length ? Math.round((doneCount / todayTodos.length) * 100) : 0;

      const sortedExams = useMemo(() => (!planner ? [] : [...planner.exams].sort((a, b) => new Date(a.date) - new Date(b.date))), [planner]);
      const nearestExam = sortedExams.find((e) => dday(e.date) >= 0) || sortedExams[0] || null;

      const TABS = currentUser && currentUser.role === "admin" ? [...BASE_TABS, ADMIN_TAB] : BASE_TABS;
      const currentTab = TABS.find((t) => t.key === activeTab);
      const pendingCount = requests.filter((r) => r.status === "pending").length;

      const visiblePosts = useMemo(() => {
        if (!currentUser || !POST_TABS.includes(activeTab)) return [];
        return sortPosts(filterForUser(posts[activeTab], currentUser));
      }, [posts, activeTab, currentUser]);

      /* ---------- 인증 핸들러 ---------- */
      const handleSignup = (e) => {
        e.preventDefault();
        const { userId, password, password2, name, grade, classNum, schoolCode } = authForm;
        if (!name.trim() || !userId.trim() || !password || !schoolCode.trim()) return setAuthError("모든 항목(학교/관리자 코드 포함)을 빠짐없이 입력해 주세요.");
        const role = SCHOOL_CODES[schoolCode.trim()];
        if (!role) return setAuthError("학교/관리자 코드가 올바르지 않습니다. 안내받은 코드를 다시 확인해 주세요.");
        if (!/^[가-힣a-zA-Z\s]{2,10}$/.test(name.trim())) return setAuthError("실명을 정확히 입력해 주세요. (한글/영문 2~10자)");
        if (userId.trim().length < 4) return setAuthError("아이디는 4자 이상이어야 합니다.");
        if (users.some((u) => u.userId === userId.trim())) return setAuthError("이미 사용 중인 아이디입니다.");
        if (password.length < 4) return setAuthError("비밀번호는 4자 이상이어야 합니다.");
        if (password !== password2) return setAuthError("비밀번호가 일치하지 않습니다.");

        const newUser = { userId: userId.trim(), password, name: name.trim(), grade: Number(grade), classNum: Number(classNum), role };
        setUsers((p) => [...p, newUser]);
        setAuthError("");
        setAuthMode("login"); // 가입 성공 → 로그인 폼으로 자동 전환
        setAuthForm({ ...EMPTY_AUTH, userId: newUser.userId });
        showToast(role === "admin" ? `관리자 가입 완료! ${newUser.name} 님, 로그인해 주세요.` : `가입 완료! ${newUser.name} 학생, 로그인해 주세요.`);
      };

      const doLogin = (user) => {
        setPlannerStore((prev) => (prev[user.userId] ? prev : { ...prev, [user.userId]: defaultPlanner() }));
        setCurrentUser(user);
        setAuthError("");
        setAuthForm(EMPTY_AUTH);
        setActiveTab("planner");
        setShowWelcome(true);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const found = users.find((u) => u.userId === authForm.userId.trim() && u.password === authForm.password);
        if (!found) return setAuthError("아이디 또는 비밀번호가 올바르지 않습니다.");
        doLogin(found);
      };

      /* ---------- 게시물 핸들러 ---------- */
      const openAdd = () => {
        setEditingPost(null);
        setForm({ ...EMPTY_FORM, grade: currentUser.grade, classNum: currentUser.role === "admin" ? 0 : currentUser.classNum });
        setAiError(null); setAiPass(""); setAddOpen(true);
      };

      const openEdit = (post) => { // 관리자 전용
        setEditingPost(post);
        setForm({
          title: post.title, subject: post.subject, content: post.content || "",
          grade: post.grade, classNum: post.classNum, due: post.due || "", bookType: post.bookType || "추천 교재",
          file: post.file || null, fileName: post.fileName || "", fileType: post.fileType || "", fileSizeB: post.fileSizeB || 0,
        });
        setDetail(null); setAiError(null); setAiPass(""); setAddOpen(true);
      };

      const handleFile = (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        if (f.size > 8 * 1024 * 1024) {
          setAiError({ tag: "용량 초과", reason: "8MB 이하의 파일만 업로드할 수 있습니다." });
          e.target.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => setForm((p) => ({ ...p, file: reader.result, fileName: f.name, fileType: f.type || "application/octet-stream", fileSizeB: f.size }));
        reader.readAsDataURL(f); // Base64 임시 저장
      };

      const submitPost = (e) => {
        e.preventDefault();
        setAiError(null); setAiPass("");
        const type = editingPost ? editingPost.type : activeTab;
        if (!form.title.trim()) return setAiError({ tag: "입력 누락", reason: "제목을 입력해 주세요." });
        if (type === "assignments" && !form.due) return setAiError({ tag: "입력 누락", reason: "수행평가는 제출 마감 기한을 반드시 지정해야 합니다." });

        const verdict = aiModerate({ title: form.title, content: form.content, subject: form.subject });
        if (!verdict.ok) return setAiError(verdict);

        if (editingPost) {
          setPosts((p) => ({
            ...p,
            [type]: p[type].map((x) => x.id === editingPost.id ? {
              ...x, title: form.title.trim(), subject: form.subject, content: form.content.trim(),
              grade: Number(form.grade), classNum: Number(form.classNum), due: form.due, bookType: form.bookType,
              file: form.file, fileName: form.fileName, fileType: form.fileType, fileSizeB: form.fileSizeB,
            } : x),
          }));
          setAddOpen(false); setEditingPost(null); setForm(EMPTY_FORM);
          showToast("게시물이 수정되었습니다. ✏️");
          return;
        }

        const post = {
          id: `${type}-${Date.now()}`, type,
          title: form.title.trim(), subject: form.subject, content: form.content.trim(),
          grade: Number(form.grade), classNum: Number(form.classNum), due: form.due, bookType: form.bookType,
          file: form.file, fileName: form.fileName, fileType: form.fileType, fileSizeB: form.fileSizeB,
          authorId: currentUser.userId, authorName: currentUser.name,
          authorGrade: currentUser.grade, authorClass: currentUser.classNum, authorRole: currentUser.role,
          createdAt: Date.now(),
        };
        setPosts((p) => ({ ...p, [type]: [post, ...p[type]] }));
        setAiPass(verdict.reason);
        setTimeout(() => { setAddOpen(false); setForm(EMPTY_FORM); setAiPass(""); showToast("AI 검수를 통과하여 정상 등록되었습니다. ✅"); }, 900);
      };

      const confirmDelete = () => { // 관리자 전용
        const { type, id } = deleteTarget;
        setPosts((p) => ({ ...p, [type]: p[type].filter((x) => x.id !== id) }));
        setDeleteTarget(null); setDetail(null);
        showToast("게시물이 삭제되었습니다. 🗑");
      };

      const downloadFile = (post) => {
        if (!post.file) return showToast("첨부된 파일이 없습니다.");
        const a = document.createElement("a");
        a.href = post.file; a.download = post.fileName || "download";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        showToast(`${post.fileName} 다운로드를 시작합니다.`);
      };

      /* ---------- 학생 요청 핸들러 ---------- */
      const openRequest = (post) => {
        setRequestTarget({ id: post.id, type: post.type, title: post.title });
        setRequestType("삭제"); setRequestReason(""); setDetail(null);
      };

      const submitRequest = (e) => {
        e.preventDefault();
        if (requestReason.trim().length < 5) return showToast("요청 사유를 5자 이상 작성해 주세요.");
        setRequests((r) => [{
          id: `req-${Date.now()}`,
          postId: requestTarget.id, postType: requestTarget.type, postTitle: requestTarget.title,
          kind: requestType, reason: requestReason.trim(),
          requesterName: currentUser.name, requesterGrade: currentUser.grade, requesterClass: currentUser.classNum,
          status: "pending", createdAt: Date.now(),
        }, ...r]);
        setRequestTarget(null); setRequestReason("");
        showToast("관리자에게 요청이 전송되었습니다. 📮");
      };

      const approveRequest = (req) => { // 승인: 삭제 요청이면 게시물 삭제, 수정 요청이면 수정 모달 오픈
        const post = (posts[req.postType] || []).find((p) => p.id === req.postId);
        if (req.kind === "삭제") {
          if (post) setPosts((p) => ({ ...p, [req.postType]: p[req.postType].filter((x) => x.id !== req.postId) }));
          showToast(post ? "요청을 승인하여 게시물을 삭제했습니다." : "이미 삭제된 게시물입니다. 요청을 종료합니다.");
        } else {
          if (post) { openEdit(post); showToast("수정 요청을 승인했습니다. 내용을 수정해 주세요."); }
          else showToast("이미 삭제된 게시물입니다. 요청을 종료합니다.");
        }
        setRequests((r) => r.map((x) => (x.id === req.id ? { ...x, status: "approved" } : x)));
      };

      const rejectRequest = (req) => {
        setRequests((r) => r.map((x) => (x.id === req.id ? { ...x, status: "rejected" } : x)));
        showToast("요청을 반려했습니다.");
      };

      /* ---------- 플래너 핸들러 ---------- */
      const addTodo = (e) => {
        e.preventDefault();
        if (!todoForm.text.trim()) return;
        setPlanner((p) => ({ ...p, todos: [...p.todos, { id: `t${Date.now()}`, ...todoForm, text: todoForm.text.trim(), done: false, date: TODAY }] }));
        setTodoForm({ text: "", subject: todoForm.subject, book: "", unit: "", priority: "mid" });
      };
      const toggleTodo = (id) => setPlanner((p) => ({ ...p, todos: p.todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t)) }));
      const removeTodo = (id) => setPlanner((p) => ({ ...p, todos: p.todos.filter((t) => t.id !== id) }));

      const addMemo = (e) => {
        e.preventDefault();
        if (!memoForm.title.trim() || !memoForm.content.trim()) return showToast("오답노트 제목과 내용을 입력해 주세요.");
        setPlanner((p) => ({ ...p, memos: [{ id: `m${Date.now()}`, ...memoForm, createdAt: Date.now() }, ...p.memos] }));
        setMemoForm({ title: "", subject: memoForm.subject, content: "" });
        showToast("오답노트가 저장되었습니다. 📝");
      };
      const removeMemo = (id) => setPlanner((p) => ({ ...p, memos: p.memos.filter((m) => m.id !== id) }));

      const startEditExam = (ex) => { setEditingExam(ex.id); setExamDraft({ name: ex.name, date: ex.date }); };
      const saveExam = (id) => {
        if (!examDraft.name.trim() || !examDraft.date) return showToast("시험 이름과 날짜를 모두 입력해 주세요.");
        setPlanner((p) => ({ ...p, exams: p.exams.map((e) => (e.id === id ? { ...e, name: examDraft.name.trim(), date: examDraft.date } : e)) }));
        setEditingExam(null);
        showToast("시험 일정이 수정되었습니다.");
      };
      const addExam = () =>
        setPlanner((p) => {
          const id = `e${Date.now()}`;
          setTimeout(() => { setEditingExam(id); setExamDraft({ name: "새 시험", date: TODAY }); }, 0);
          return { ...p, exams: [...p.exams, { id, name: "새 시험", date: TODAY }] };
        });
      const removeExam = (id) => setPlanner((p) => ({ ...p, exams: p.exams.filter((e) => e.id !== id) }));

      const generateAIPlan = () => {
        setAiLoading(true); setAiPlanMsg("");
        setTimeout(() => {
          const weak = ["수학", "영어", "국어"][Math.floor(Math.random() * 3)];
          const picked = [...AI_PLAN_TEMPLATES].sort(() => Math.random() - 0.5).slice(0, 3);
          const plans = picked.map((tpl, i) => ({
            id: `ai${Date.now()}${i}`, text: tpl.text.replace("{subject}", weak), subject: weak,
            book: "AI 추천", unit: nearestExam ? `${nearestExam.name} 대비` : "자율 학습",
            priority: tpl.priority, done: false, date: TODAY, ai: true,
          }));
          setPlanner((p) => ({ ...p, todos: [...p.todos, ...plans] }));
          setAiLoading(false);
          setAiPlanMsg(`${nearestExam ? `${nearestExam.name}(${ddayLabel(dday(nearestExam.date))})` : "현재 학습 상황"}과 최근 달성률 ${progress}%를 분석해 ${weak} 중심 플랜 3개를 추가했습니다.`);
        }, 1400);
      };

      /* =============== 1) 로그인/회원가입 (하드 게이트) =============== */
      if (!currentUser) {
        return (
          <div className="min-h-screen w-full bg-gradient-to-br from-slate-900 via-indigo-900 to-violet-900 flex items-center justify-center p-4">
            <div className="w-full max-w-md">
              <div className="text-center mb-8">
                <div className="inline-grid place-items-center w-16 h-16 rounded-2xl bg-white/10 backdrop-blur border border-white/20 text-3xl mb-4">🎓</div>
                <h1 className="text-3xl font-extrabold text-white tracking-tight">성광고 학습 플랫폼</h1>
                <p className="text-indigo-200 text-sm mt-2">성광고등학교 학생·관리자 전용 · 학년/반 맞춤 학습 통합 서비스</p>
              </div>

              <div className="bg-white rounded-3xl shadow-2xl p-7">
                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-2xl mb-6">
                  {[{ k: "login", l: "로그인" }, { k: "signup", l: "회원가입" }].map((m) => (
                    <button key={m.k} type="button" onClick={() => { setAuthMode(m.k); setAuthError(""); }}
                      className={`py-2.5 rounded-xl text-sm font-bold transition ${authMode === m.k ? "bg-white text-indigo-700 shadow" : "text-slate-500 hover:text-slate-700"}`}>
                      {m.l}
                    </button>
                  ))}
                </div>

                <form onSubmit={authMode === "login" ? handleLogin : handleSignup}>
                  {authMode === "signup" && (
                    <React.Fragment>
                      <Field label="실명" hint="학생 본인 확인을 위해 반드시 실명을 입력해야 합니다.">
                        <input className={inputCls} placeholder="예) 홍길동" value={authForm.name} onChange={(e) => setAuthForm({ ...authForm, name: e.target.value })} />
                      </Field>
                      <div className="grid grid-cols-2 gap-3">
                        <Field label="학년">
                          <select className={inputCls} value={authForm.grade} onChange={(e) => setAuthForm({ ...authForm, grade: Number(e.target.value) })}>
                            {GRADES.map((g) => <option key={g} value={g}>{g}학년</option>)}
                          </select>
                        </Field>
                        <Field label="반">
                          <select className={inputCls} value={authForm.classNum} onChange={(e) => setAuthForm({ ...authForm, classNum: Number(e.target.value) })}>
                            {CLASSES.map((c) => <option key={c} value={c}>{c}반</option>)}
                          </select>
                        </Field>
                      </div>
                      <Field label="학교/관리자 코드" hint="학교에서 안내받은 코드를 입력하세요. 코드에 따라 학생/관리자 권한이 부여됩니다.">
                        <input className={inputCls} placeholder="4자리 코드" value={authForm.schoolCode} maxLength={4}
                          onChange={(e) => setAuthForm({ ...authForm, schoolCode: e.target.value.replace(/\D/g, "") })} />
                      </Field>
                    </React.Fragment>
                  )}

                  <Field label="아이디">
                    <input className={inputCls} placeholder="영문/숫자 4자 이상" value={authForm.userId} onChange={(e) => setAuthForm({ ...authForm, userId: e.target.value })} />
                  </Field>
                  <Field label="비밀번호">
                    <input type="password" className={inputCls} placeholder="4자 이상" value={authForm.password} onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })} />
                  </Field>
                  {authMode === "signup" && (
                    <Field label="비밀번호 확인">
                      <input type="password" className={inputCls} placeholder="비밀번호 재입력" value={authForm.password2} onChange={(e) => setAuthForm({ ...authForm, password2: e.target.value })} />
                    </Field>
                  )}

                  {authError && (
                    <div className="mb-4 px-4 py-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm font-medium">⚠️ {authError}</div>
                  )}

                  <button type="submit" className="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm hover:opacity-90 active:scale-[0.99] transition shadow-lg shadow-indigo-500/30">
                    {authMode === "login" ? "로그인" : "성광고 학생으로 가입하기"}
                  </button>
                </form>

                <div className="grid grid-cols-2 gap-2 mt-3">
                  <button type="button" onClick={() => doLogin(users[0])} className="py-3 rounded-xl border border-slate-200 text-slate-600 text-xs font-semibold hover:bg-slate-50 transition">
                    학생 체험 입장<br /><span className="text-slate-400">(1학년 8반 홍길동)</span>
                  </button>
                  <button type="button" onClick={() => doLogin(users[1])} className="py-3 rounded-xl border border-violet-200 text-violet-700 text-xs font-semibold hover:bg-violet-50 transition">
                    관리자 체험 입장<br /><span className="text-violet-400">(김선생)</span>
                  </button>
                </div>
              </div>

              <p className="text-center text-indigo-300/70 text-xs mt-6">© 성광고등학교 학생 자율 학습 커뮤니티 · 교내 구성원 외 이용 불가</p>
            </div>
            <Toast msg={toast} />
          </div>
        );
      }

      /* =============== 2) 메인 애플리케이션 =============== */
      const isAdmin = currentUser.role === "admin";

      return (
        <div className="min-h-screen bg-slate-100 text-slate-800">
          {/* ===== 헤더 ===== */}
          <header className="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200">
            <div className="max-w-6xl mx-auto px-4 sm:px-6">
              <div className="h-16 flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5 min-w-0">
                  <div className="w-9 h-9 shrink-0 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 grid place-items-center text-white text-lg">🎓</div>
                  <div className="min-w-0">
                    <p className="font-extrabold text-slate-900 leading-tight truncate">성광고 학습 플랫폼</p>
                    <p className="text-[11px] text-slate-500 leading-tight hidden sm:block">{isAdmin ? "관리자 모드 · 전체 게시물 관리" : "학년·반 맞춤 자료 자동 필터링"}</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-indigo-50 border border-indigo-100">
                    <span className="w-6 h-6 rounded-full bg-indigo-600 text-white grid place-items-center text-[11px] font-bold">{currentUser.name.slice(0, 1)}</span>

                              승인 {req.kind === "삭제" ? "(게시물 삭제)" : "(수정 창 열기)"}
                            </button>
                            <button type="button" onClick={() => rejectRequest(req)}
                              className="flex-1 py-2.5 rounded-xl bg-white border border-slate-300 text-slate-700 text-sm font-bold hover:bg-slate-50 transition">반려</button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}
          </main>

          {/* ===== 초기 진입 팝업 (전체 dim 오버레이) ===== */}
          <Modal open={showWelcome} onClose={() => setShowWelcome(false)}
            title={`${currentUser.name} ${isAdmin ? "관리자님" : "학생"}, 환영합니다! 👋`}
            subtitle={`${isAdmin ? "관리자 모드" : `${currentUser.grade}학년 ${currentUser.classNum}반`} · ${fmtDate(TODAY)}`}
            footer={<button type="button" onClick={() => setShowWelcome(false)} className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition">확인하고 시작하기</button>}>
            <div className="p-4 rounded-2xl bg-indigo-50 border border-indigo-200 mb-4">
              <p className="text-sm font-bold text-indigo-900 mb-2">오늘의 학습 체크리스트 달성률</p>
              <div className="flex items-center gap-3">
                <span className="text-3xl font-extrabold text-indigo-700 tabular-nums">{progress}%</span>
                <div className="flex-1">
                  <ProgressBar value={progress} />
                  <p className="text-xs text-indigo-700/80 mt-1.5">{todayTodos.length}개 중 {doneCount}개 완료 · 남은 목표 {todayTodos.length - doneCount}개</p>
                </div>
              </div>
            </div>
            <div className="p-4 rounded-2xl bg-rose-50 border border-rose-200">
              <p className="text-sm font-bold text-rose-900 mb-2">가장 가까운 시험</p>
              {nearestExam ? (
                <div className="flex items-center justify-between gap-3">
                  <div>
                    <p className="font-extrabold text-slate-900">{nearestExam.name}</p>
                    <p className="text-xs text-slate-600 mt-0.5">{fmtDate(nearestExam.date)}</p>
                  </div>
                  <span className="px-3 py-1.5 rounded-xl bg-rose-600 text-white font-extrabold tabular-nums">{ddayLabel(dday(nearestExam.date))}</span>
                </div>
              ) : <p className="text-sm text-slate-600">등록된 시험 일정이 없습니다.</p>}
            </div>
            <ul className="mt-4 space-y-1.5 text-xs text-slate-500">
              {isAdmin
                ? <li>• 관리자 권한으로 전체 게시물 수정·삭제와 <b className="text-slate-700">학생 요청사항 관리</b>가 가능합니다.</li>
                : <li>• 모든 자료는 <b className="text-slate-700">{currentUser.grade}학년 공통 + {currentUser.classNum}반</b> 기준으로 자동 필터링됩니다.</li>}
              <li>• 게시물은 Gemini AI 검수를 통과해야 등록됩니다.</li>
              <li>• 모바일에서는 우측 하단 위젯으로 진도율과 D-Day를 바로 확인할 수 있습니다.</li>
            </ul>
          </Modal>

          {/* ===== 상세 보기 팝업 ===== */}
          <Modal open={!!detail} onClose={() => setDetail(null)} maxW="max-w-2xl"
            title={detail ? detail.title : ""}
            subtitle={detail ? `${(BASE_TABS.find((t) => t.key === detail.type) || {}).label} · ${new Date(detail.createdAt).toLocaleString("ko-KR")}` : ""}
            footer={detail && (
              <div className="flex gap-2">
                {detail.type === "materials" && detail.file && (
                  <button type="button" onClick={() => downloadFile(detail)} className="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm transition">
                    ⬇ 파일 다운로드 ({fmtSize(detail.fileSizeB)})
                  </button>
                )}
                {isAdmin ? (
                  <React.Fragment>
                    <button type="button" onClick={() => openEdit(detail)} className="px-5 py-3 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold text-sm hover:bg-indigo-100 transition">✏️ 수정</button>
                    <button type="button" onClick={() => setDeleteTarget({ type: detail.type, id: detail.id, title: detail.title })}
                      className="px-5 py-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 font-bold text-sm hover:bg-rose-100 transition">🗑 삭제</button>
                  </React.Fragment>
                ) : (
                  <button type="button" onClick={() => openRequest(detail)} className="px-5 py-3 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 font-bold text-sm hover:bg-indigo-100 transition">📮 삭제/수정 요청</button>
                )}
                <button type="button" onClick={() => setDetail(null)} className="px-5 py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50 transition">닫기</button>
              </div>
            )}>
            {detail && (
              <React.Fragment>
                <div className="flex flex-wrap gap-1.5 mb-4">
                  <ScopeBadge grade={detail.grade} classNum={detail.classNum} />
                  <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-800 text-white">{detail.subject}</span>
                  {detail.bookType && <span className="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-200">{detail.bookType}</span>}
                  <AuthorBadge post={detail} />
                </div>
                {detail.type === "assignments" && detail.due && (
                  <div className="mb-4 p-4 rounded-2xl bg-rose-50 border border-rose-200">
                    <p className="text-xs font-bold text-rose-700 mb-1">제출 마감 기한</p>
                    <div className="flex items-center justify-between">
                      <p className="font-extrabold text-slate-900">{fmtDateTime(detail.due)}</p>
                      <span className="px-3 py-1 rounded-lg bg-rose-600 text-white text-sm font-extrabold">{ddayLabel(dday(detail.due))}</span>
                    </div>
                  </div>
                )}
                <div className="p-4 rounded-2xl bg-slate-50 border border-slate-200 mb-4">
                  <p className="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">{detail.content || "등록된 상세 내용이 없습니다."}</p>
                </div>
                {detail.type === "materials" && detail.file && (
                  <div className="p-4 rounded-2xl border border-slate-200">
                    <p className="text-xs font-bold text-slate-500 mb-2">첨부 파일</p>
                    {detail.fileType && detail.fileType.startsWith("image/") ? (
                      <img src={detail.file} alt={detail.fileName} className="w-full rounded-xl border border-slate-200" />
                    ) : (
                      <div className="flex items-center gap-3 p-4 rounded-xl bg-slate-50">
                        <span className="text-3xl">{detail.fileType && detail.fileType.includes("pdf") ? "📄" : "📎"}</span>
                        <div className="min-w-0">
                          <p className="font-bold text-slate-800 text-sm truncate">{detail.fileName}</p>
                          <p className="text-xs text-slate-500">{fmtSize(detail.fileSizeB)} · {detail.fileType}</p>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </React.Fragment>
            )}
          </Modal>

          {/* ===== 새 항목 등록 / 수정 팝업 ===== */}
          <Modal open={addOpen} onClose={() => { setAddOpen(false); setEditingPost(null); }} maxW="max-w-xl"
            title={editingPost ? "✏️ 게시물 수정 (관리자)" : `${currentTab ? currentTab.icon + " " + currentTab.label : ""} · 새 항목 등록`}
            subtitle={editingPost ? `대상: “${editingPost.title}”` : "등록 즉시 Gemini AI가 학습 관련성을 검수합니다."}>
            <form onSubmit={submitPost}>
              <Field label="제목">
                <input className={inputCls} placeholder="예) 2학기 기말고사 영어 본문 정리본" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />
              </Field>

              <div className="grid grid-cols-2 gap-3">
                <Field label="과목">
                  <select className={inputCls} value={form.subject} onChange={(e) => setForm({ ...form, subject: e.target.value })}>
                    {SUBJECTS.map((s) => <option key={s}>{s}</option>)}
                  </select>
                </Field>
                {(editingPost ? editingPost.type : activeTab) === "books" && (
                  <Field label="유형">
                    <select className={inputCls} value={form.bookType} onChange={(e) => setForm({ ...form, bookType: e.target.value })}>
                      <option>추천 교재</option><option>족보</option><option>인강/강의</option>
                    </select>
                  </Field>
                )}
              </div>

              <div className="grid grid-cols-2 gap-3">
                <Field label="작성 대상 학년" hint={isAdmin ? "" : "학생은 본인 학년으로 고정됩니다."}>
                  <select className={inputCls} value={form.grade} disabled={!isAdmin} onChange={(e) => setForm({ ...form, grade: Number(e.target.value) })}>
                    {(isAdmin ? GRADES : [currentUser.grade]).map((g) => <option key={g} value={g}>{g}학년</option>)}
                  </select>
                </Field>
                <Field label="작성 대상 반" hint="‘학년 공통’ 선택 시 해당 학년 전체에게 노출됩니다.">
                  {isAdmin ? (
                    <select className={inputCls} value={form.classNum} onChange={(e) => setForm({ ...form, classNum: Number(e.target.value) })}>
                      <option value={0}>학년 공통</option>
                      {CLASSES.map((c) => <option key={c} value={c}>{c}반 전용</option>)}
                    </select>
                  ) : (
                    <select className={inputCls} value={form.classNum} onChange={(e) => setForm({ ...form, classNum: Number(e.target.value) })}>
                      <option value={0}>학년 공통</option>
                      <option value={currentUser.classNum}>{currentUser.grade}학년 {currentUser.classNum}반 전용</option>
                    </select>
                  )}
                </Field>
              </div>

              {(editingPost ? editingPost.type : activeTab) === "assignments" && (
                <Field label="제출 마감 기한" hint="날짜와 시간을 모두 지정해야 등록됩니다.">
                  <input type="datetime-local" className={inputCls} value={form.due} onChange={(e) => setForm({ ...form, due: e.target.value })} />
                </Field>
              )}

              <Field label={(editingPost ? editingPost.type : activeTab) === "examscope" ? "시험 범위 상세" : "상세 설명"}>
                <textarea rows={4} className={inputCls + " resize-none"} placeholder="자료에 대한 설명을 구체적으로 작성해 주세요."
                  value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} />
              </Field>

              {(editingPost ? editingPost.type : activeTab) === "materials" && (
                <Field label="파일 첨부 (PDF, 이미지 등 · 8MB 이하)">
                  <input ref={fileRef} type="file" accept=".pdf,image/*,.doc,.docx,.ppt,.pptx,.hwp,.txt,.zip" onChange={handleFile}
                    className="w-full text-sm text-slate-600 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-600 file:text-white file:text-sm file:font-bold hover:file:bg-indigo-700 cursor-pointer" />
                  {form.fileName && (
                    <div className="mt-2 flex items-center gap-2 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-sm text-emerald-800 font-semibold">
                      ✅ {form.fileName} <span className="text-xs font-normal">({fmtSize(form.fileSizeB)}) 업로드 준비 완료</span>
                    </div>
                  )}
                </Field>
              )}

              {aiError && (
                <div className="mb-4 p-4 rounded-xl bg-rose-50 border-2 border-rose-300">
                  <p className="text-sm font-extrabold text-rose-700">🤖 AI 검수 거절 · {aiError.tag}</p>
                  <p className="text-sm text-rose-700 mt-1.5 leading-relaxed">{aiError.reason}</p>
                </div>
              )}
              {aiPass && (
                <div className="mb-4 p-4 rounded-xl bg-emerald-50 border-2 border-emerald-300">
                  <p className="text-sm font-extrabold text-emerald-700">✅ AI 검수 통과</p>
                  <p className="text-sm text-emerald-700 mt-1.5">{aiPass}</p>
                </div>
              )}

              <div className="flex gap-2">
                <button type="submit" className="flex-1 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm hover:opacity-90 transition">
                  {editingPost ? "수정 내용 저장" : "AI 검수 후 등록하기"}
                </button>
                <button type="button" onClick={() => { setAddOpen(false); setEditingPost(null); }} className="px-5 py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50 transition">취소</button>
              </div>
            </form>
          </Modal>

          {/* ===== 학생 → 관리자 요청 모달 ===== */}
          <Modal open={!!requestTarget} onClose={() => setRequestTarget(null)} maxW="max-w-md"
            title="📮 관리자에게 삭제/수정 요청하기"
            subtitle={requestTarget ? `대상: “${requestTarget.title}”` : ""}>
            <form onSubmit={submitRequest}>
              <Field label="요청 종류">
                <div className="grid grid-cols-2 gap-2">
                  {["삭제", "수정"].map((k) => (
                    <button key={k} type="button" onClick={() => setRequestType(k)}
                      className={`py-2.5 rounded-xl text-sm font-bold border transition ${requestType === k ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-slate-600 border-slate-300 hover:bg-slate-50"}`}>
                      {k} 요청
                    </button>
                  ))}
                </div>
              </Field>
              <Field label="요청 사유" hint="관리자가 확인할 수 있도록 구체적으로 작성해 주세요. (5자 이상)">
                <textarea rows={4} className={inputCls + " resize-none"} placeholder="예) 잘못된 시험 범위 정보가 포함되어 있어 삭제가 필요합니다."
                  value={requestReason} onChange={(e) => setRequestReason(e.target.value)} />
              </Field>
              <div className="flex gap-2">
                <button type="submit" className="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm transition">요청 전송</button>
                <button type="button" onClick={() => setRequestTarget(null)} className="px-5 py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50 transition">취소</button>
              </div>
            </form>
          </Modal>

          {/* ===== 삭제 확인 (관리자) ===== */}
          <Modal open={!!deleteTarget} onClose={() => setDeleteTarget(null)} maxW="max-w-sm" title="정말 삭제하시겠습니까?">
            <p className="text-sm text-slate-600 leading-relaxed">
              <b className="text-slate-900">“{deleteTarget && deleteTarget.title}”</b> 게시물을 삭제합니다. 삭제된 자료와 첨부 파일은 복구할 수 없습니다.
            </p>
            <div className="flex gap-2 mt-5">
              <button type="button" onClick={confirmDelete} className="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm transition">삭제하기</button>
              <button type="button" onClick={() => setDeleteTarget(null)} className="flex-1 py-3 rounded-xl bg-white border border-slate-300 text-slate-700 font-bold text-sm hover:bg-slate-50 transition">취소</button>
            </div>
          </Modal>

          {/* ===== 모바일 플로팅 위젯 ===== */}
          <div className="fixed right-4 bottom-4 z-[80] flex flex-col items-end gap-3">
            {showWidget && (
              <div className="w-72 bg-white rounded-2xl shadow-2xl border border-slate-200 p-4 animate-pop">
                <div className="flex items-center justify-between mb-3">
                  <p className="text-sm font-extrabold text-slate-900">📌 학습 현황 위젯</p>
                  <button type="button" onClick={() => setShowWidget(false)} className="w-7 h-7 rounded-full bg-slate-100 text-slate-500 text-xs font-bold">✕</button>
                </div>
                <div className="p-3 rounded-xl bg-indigo-50 border border-indigo-100 mb-2.5">
                  <div className="flex items-end justify-between mb-1.5">
                    <span className="text-xs font-bold text-indigo-900">오늘 진도율</span>
                    <span className="text-xl font-extrabold text-indigo-700 tabular-nums leading-none">{progress}%</span>
                  </div>
                  <ProgressBar value={progress} />
                  <p className="text-[11px] text-indigo-700/80 mt-1.5">{doneCount}/{todayTodos.length} 완료</p>
                </div>
                {nearestExam && (
                  <div className="p-3 rounded-xl bg-rose-50 border border-rose-100 mb-2.5 flex items-center justify-between gap-2">
                    <div className="min-w-0">
                      <p className="text-[11px] font-bold text-rose-700">가장 가까운 시험</p>
                      <p className="text-sm font-bold text-slate-900 truncate">{nearestExam.name}</p>
                    </div>
                    <span className="shrink-0 px-2 py-1 rounded-lg bg-rose-600 text-white text-xs font-extrabold">{ddayLabel(dday(nearestExam.date))}</span>
                  </div>
                )}
                <div className="max-h-40 overflow-y-auto space-y-1.5">
                  {todayTodos.slice(0, 5).map((t) => (
                    <button key={t.id} type="button" onClick={() => toggleTodo(t.id)} className="w-full flex items-start gap-2 p-2 rounded-lg hover:bg-slate-50 text-left transition">
                      <span className={`mt-0.5 w-4 h-4 shrink-0 rounded border-2 grid place-items-center text-[10px] ${t.done ? "bg-indigo-600 border-indigo-600 text-white" : "border-slate-300"}`}>{t.done && "✓"}</span>
                      <span className={`text-xs leading-snug ${t.done ? "line-through text-slate-400" : "text-slate-700"}`}>{t.text}</span>
                    </button>
                  ))}
                  {todayTodos.length === 0 && <p className="text-xs text-slate-400 text-center py-3">등록된 목표가 없습니다.</p>}
                </div>
              </div>
            )}
            <button type="button" onClick={() => setShowWidget((v) => !v)} title="학습 현황 위젯"
              className="relative w-14 h-14 rounded-full bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-2xl shadow-indigo-600/40 grid place-items-center text-xl active:scale-95 transition">
              {showWidget ? "✕" : "📊"}
              {!showWidget && todayTodos.length - doneCount > 0 && (
                <span className="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-rose-500 text-white text-[11px] font-bold grid place-items-center border-2 border-white">
                  {todayTodos.length - doneCount}
                </span>
              )}
            </button>
          </div>

          <Toast msg={toast} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<SungkwangApp />);
  </script>
</body>
</html>
